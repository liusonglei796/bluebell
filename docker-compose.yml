# ============================================
# 生产单机部署 (Single Server Production)
# 包含完整服务栈: Go API + Go Consumer + 前端 + Nginx + MySQL + Redis + RabbitMQ
# 使用: docker compose up -d
# ============================================
services:
  mysql:
    image: mysql:8.0
    container_name: bluebell_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 15939087780Ll@
      MYSQL_DATABASE: bluebell
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - bluebell_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: bluebell_redis
    command: ["redis-server", "--requirepass", "bluebell_redis_password_secure"]
    volumes:
      - ./data/redis:/data
    restart: always
    networks:
      - bluebell_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bluebell_redis_password_secure", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bluebell_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672" # RabbitMQ 管理控制台 (可选)
    restart: always
    networks:
      - bluebell_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 5

  # Go 后端 API 服务 (Web API 进程)
  bluebell_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluebell_app
    ports:
      - "8083:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bluebell_net
    restart: always
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
      - ./logs/app:/app/logs

  # Go 后端异步消费者服务 (独立后台 Worker 进程)
  bluebell_consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluebell_consumer
    entrypoint: ["/app/bluebell_consumer", "-conf", "/app/config.toml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bluebell_net
    restart: always
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
      - ./logs/consumer:/app/logs

  # 前端构建 (构建完成后自动退出)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/app/dist
    networks:
      - bluebell_net

  # Nginx 反向代理 + 前端静态服务
  nginx:
    image: nginx:alpine
    container_name: bluebell_nginx
    ports:
      - "8082:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - bluebell_api
    networks:
      - bluebell_net
    restart: always

networks:
  bluebell_net:
    driver: bridge

volumes:
  frontend_dist:
